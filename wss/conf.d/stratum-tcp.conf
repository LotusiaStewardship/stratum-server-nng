# -----------------------------------------------------------------------------
# stratum-tcp.conf — Raw TCP proxy for legacy miners (optional)
# -----------------------------------------------------------------------------
#
# This lives in the stream{} context (not http{}).
# Install to: /etc/nginx/stream.d/stratum-tcp.conf
#
# Use this when you want to expose raw TCP stratum alongside the WSS proxy,
# e.g. for ASIC miners, GPU miners, or other non-browser clients.
#
# If you ONLY need browser mining, this file is NOT required.
# -----------------------------------------------------------------------------

server {
    # Listen on the standard stratum port (or any port you prefer).
    # Keep this separate from the WSS port (:8443).
    listen  3334;

    # Proxy to the local stratum-server-nng process.
    proxy_pass  127.0.0.1:3334;

    # TCP connection timeout — fail fast if backend is down.
    proxy_connect_timeout  10s;

    # Long timeouts for persistent mining connections.
    proxy_timeout  86400s;  # 24 hours

    # Pass the real client IP to the stratum server via proxy protocol.
    # Only enable this if stratum-server-nng supports PROXY protocol.
    # Otherwise, comment it out and the server sees 127.0.0.1 as the peer.
    # proxy_protocol  on;

    # Access logging for raw TCP sessions.
    access_log  /var/log/nginx/stream-stratum.log;
}

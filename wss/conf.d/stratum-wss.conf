# -----------------------------------------------------------------------------
# stratum-wss.conf — WebSocket Secure proxy to stratum-server-nng
# -----------------------------------------------------------------------------
#
# Protocol flow:
#   1. Browser opens WSS connection to this server
#   2. Nginx performs the HTTP Upgrade handshake
#   3. After upgrade, nginx proxies raw TCP bytes to the stratum backend
#   4. Stratum newline-delimited JSON-RPC flows transparently in both directions
#
# Client connection:
#   const transport = new WebSocketStratumTransport(
#     'wss://pool.lotusia.org:8443/stratum'
#   );
# -----------------------------------------------------------------------------

upstream stratum_backend {
    server 127.0.0.1:3334;

    # Keep idle upstream connections alive so reconnects (page refresh,
    # tab re-open) avoid a fresh TCP handshake to the stratum server.
    keepalive  64;
}

server {
    listen  8443  ssl;
    server_name  pool.lotusia.org;

    # ---------------------------------------------------------------------------
    # SSL/TLS — replace with your actual cert paths
    # ---------------------------------------------------------------------------
    ssl_certificate      /etc/nginx/ssl/pool.lotusia.org.crt;
    ssl_certificate_key  /etc/nginx/ssl/pool.lotusia.org.key;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers  on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # ---------------------------------------------------------------------------
    # WebSocket proxy to Stratum TCP backend
    # ---------------------------------------------------------------------------
    location /stratum {
        # WebSocket upgrade headers (required)
        proxy_set_header  Upgrade           $http_upgrade;
        proxy_set_header  Connection        "Upgrade";
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;

        # Timeout tuning for long-lived mining connections
        #
        # proxy_connect_timeout  — how long to wait for the TCP connection
        #                          to the stratum backend (fail fast).
        # proxy_read_timeout     — max idle time before nginx closes the
        #                          connection from the backend side.
        #                          Mining connections last hours.
        # proxy_send_timeout     — max idle time for writing to backend.
        proxy_connect_timeout  10s;
        proxy_read_timeout     86400s;   # 24 hours
        proxy_send_timeout     86400s;   # 24 hours

        # Disable response buffering so Stratum frames flow through
        # immediately with minimal latency.
        proxy_buffering  off;

        # WebSocket subprotocol — lets the client verify it got a Stratum
        # connection, not some generic WebSocket endpoint.
        proxy_set_header  Sec-WebSocket-Protocol  "stratum-v1";

        proxy_pass  http://stratum_backend;
    }

    # ---------------------------------------------------------------------------
    # Health check endpoint — returns 200 to confirm nginx is up
    # ---------------------------------------------------------------------------
    location /health {
        access_log  off;
        return  200  'ok';
        add_header  Content-Type  text/plain;
    }

    # ---------------------------------------------------------------------------
    # Deny everything else on this port
    # ---------------------------------------------------------------------------
    location / {
        return  404;
    }
}

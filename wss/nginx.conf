# -----------------------------------------------------------------------------
# nginx.conf — main configuration for openSUSE Leap
# -----------------------------------------------------------------------------
# This file includes:
#   - events {} and http {} blocks (standard)
#   - stream {} block for raw TCP upstream (optional, loaded from stream.d/)
#
# On openSUSE Leap, the stream module ships as `nginx-mod-stream`.
# If your installation loads it via /etc/nginx/sys.d/ or similar,
# the stream{} block below will work as-is.
# -----------------------------------------------------------------------------

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

# Load dynamic modules (openSUSE Leap convention)
include /etc/nginx/sys.d/*.conf;

events {
    worker_connections  1024;
    multi_accept        on;
}

# -----------------------------------------------------------------------------
# Stream block — raw TCP/UDP proxy
# -----------------------------------------------------------------------------
# Used for legacy TCP stratum miners (ASICs, GPU miners, etc.).
# Browser miners use the http{} block WebSocket path below.
# -----------------------------------------------------------------------------
stream {
    log_format  stream_basic  '$remote_addr [$time_local] '
                              '$protocol $status $bytes_sent $bytes_received '
                              '$session_time';

    access_log  /var/log/nginx/stream-access.log  stream_basic;

    include /etc/nginx/stream.d/*.conf;
}

# -----------------------------------------------------------------------------
# HTTP block — standard + WebSocket proxy via conf.d/
# -----------------------------------------------------------------------------
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # WebSocket requires HTTP/1.1 between nginx and the backend
    # (the Upgrade header is not supported in HTTP/1.0 proxying)
    proxy_http_version  1.1;

    include /etc/nginx/conf.d/*.conf;
}

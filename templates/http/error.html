{% extends "http/base.html" %}

{% block title %}{{ footer.pool_name }} - Error {{ status_code }}{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh]">
    <h1 class="text-9xl font-bold text-primary-500">{{ status_code }}</h1>
    <h2 class="text-3xl font-semibold mt-4 mb-2">{{ title }}</h2>
    <p class="text-gray-400 text-lg mb-8">{{ message }}</p>
    <a href="/" class="px-6 py-3 bg-primary-600 hover:bg-primary-500 rounded-lg font-medium transition-colors">
        ← Back to Dashboard
    </a>
</div>
{% endblock %}

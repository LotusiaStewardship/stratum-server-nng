# -----------------------------------------------------------------------------
# stratum-server-nng example configuration
# -----------------------------------------------------------------------------
#
# This file is meant to be copied to `config.toml` and adjusted for your site.
#
# Safety notes:
# - The pool payout script must be explicit.
# - Do not leave it as OP_RETURN / nulldata.
# - `pool.signing.private_key` is only for the in-process signer path.
# - Prefer keeping private keys out of the stratum process when you can.
# -----------------------------------------------------------------------------

debug = false

# Network type: "mainnet", "testnet", or "regtest"
#
# This determines default difficulty parameters appropriate for the network.
# Override individual vardiff parameters if you need custom tuning.
#
# - mainnet: Production Lotus network (highest difficulty, most stable)
# - testnet: Public test network (lower difficulty, can be volatile)
# - regtest: Local regression testing (very low difficulty, manual block control)
network = "testnet"

# -----------------------------------------------------------------------------
# Network-Specific Configuration Examples
# -----------------------------------------------------------------------------
#
# Copy the section below that matches your network and adjust as needed.
#
# MAINNET (Production)
# --------------------
# network = "mainnet"
# stratum_bind = "0.0.0.0:3334"
# nng_rpc_url = "ipc:///home/user/.lotus/rpc.pipe"
# nng_pub_url = "ipc:///home/user/.lotus/pub.pipe"
# bitcoind_rpc.url = "http://127.0.0.1:10604"
# payout_address = "lotus_..." (mainnet address)
# fee_address = "lotus_..." (mainnet address)
# private_key = "..." (mainnet WIF)
#
# [vardiff]
# share_target_ratio = 100.0
# min_difficulty = 10.0
# max_difficulty = 10000000.0
# max_change_pct = 0.5
# vardiff_target_secs = 15.0
# vardiff_retarget_secs = 90.0
#
# TESTNET (Development/Staging)
# ------------------------------
# network = "testnet"
# stratum_bind = "0.0.0.0:3334"
# nng_rpc_url = "ipc:///home/user/.lotus/rpc.pipe"
# nng_pub_url = "ipc:///home/user/.lotus/pub.pipe"
# bitcoind_rpc.url = "http://127.0.0.1:11604"
# payout_address = "lotusT..." (testnet address)
# fee_address = "lotusT..." (testnet address)
# private_key = "..." (testnet WIF)
#
# [vardiff]
# share_target_ratio = 100.0
# min_difficulty = 4.0
# max_difficulty = 1000000.0
# max_change_pct = 0.5
# vardiff_target_secs = 15.0
# vardiff_retarget_secs = 90.0
#
# REGTEST (Local Testing)
# ------------------------
# network = "regtest"
# stratum_bind = "127.0.0.1:3334"
# nng_rpc_url = "ipc:///home/user/.lotus/rpc.pipe"
# nng_pub_url = "ipc:///home/user/.lotus/pub.pipe"
# bitcoind_rpc.url = "http://127.0.0.1:18444"
# payout_address = "lotus_regtest..." (regtest address)
# fee_address = "lotus_regtest..." (regtest address)
# private_key = "..." (regtest WIF)
#
# [vardiff]
# share_target_ratio = 50.0
# min_difficulty = 1.0
# max_difficulty = 100000.0
# max_change_pct = 0.5
# vardiff_target_secs = 5.0
# vardiff_retarget_secs = 30.0
# -----------------------------------------------------------------------------

# Stratum TCP listen address for miners.
# Common defaults:
# - 0.0.0.0:3334 for public pool ingress
# - 127.0.0.1:3334 for local testing only
stratum_bind = "0.0.0.0:3334"

# Operator API listen address.
# Keep this on localhost or a protected network segment.
api_bind = "127.0.0.1:18080"

# Bearer token for authenticated operator endpoints.
# Can also be overridden by STRATUM_API_TOKEN in the environment.
api_token = "devtoken"

# SQLite accounting database path.
sqlite_path = "./stratum-accounting.sqlite3"

# lotusd NNG RPC endpoint used for mining template requests and block submission.
# Use ipc:// on the same host or tcp:// when intentionally exposed.
nng_rpc_url = "ipc://datadir/nngrpc.pipe"

# lotusd NNG Pub/Sub endpoint used for updateblktip / mempool / reorg events.
nng_pub_url = "ipc://datadir/nngpub.pipe"

# -----------------------------------------------------------------------------
# Variable Difficulty Configuration
# -----------------------------------------------------------------------------
# 
# The stratum server uses DYNAMIC difficulty adjustment by default.
# Pool difficulty automatically tracks network difficulty from lotusd.
# Legacy static difficulty configuration is NOT supported.
#
# How it works:
# 1. lotusd publishes new mining templates via NNG pub/sub when blocks are found
# 2. Stratum server fetches the new template (contains new network difficulty)
# 3. Pool difficulty = network_difficulty / share_target_ratio
# 4. All connected miners receive updated difficulty via mining.set_difficulty
# 5. Per-miner VarDiff fine-tunes from this baseline based on share rate
#

[vardiff]

# Ratio of network difficulty to pool difficulty.
# pool_difficulty = network_difficulty / share_target_ratio
#
# Rationale:
# - Determines how much easier pool shares are compared to network blocks
# - Higher ratio = easier shares = more frequent submissions
# - Lower ratio = harder shares = fewer submissions
# - 100.0 means if network diff is 1000, pool diff is 10
# - Typical range: 50-200
#   - 50: Very frequent shares (every few seconds for typical miners)
#   - 100: Balanced (every 10-20 seconds) [RECOMMENDED]
#   - 200: Less frequent shares (every 20-40 seconds)
#
# NOTE: For testnet with high network difficulty (~50M), set this to ~50,000,000
# to achieve pool difficulty around 1.0. Adjust based on your network conditions.
# Monitor share submission rate and adjust accordingly.
share_target_ratio = 100.0  # Recommended default for most deployments

# Minimum pool difficulty (absolute floor).
#
# Rationale:
# - Prevents difficulty from crashing to near-zero on low-hashrate testnet
# - 4.0 is a reasonable floor:
#   - High enough to prevent abuse/spam from ultra-low-diff shares
#   - Low enough for low-powered miners (CPU, mobile) to contribute
#   - Significantly lower than typical testnet network difficulty (~100-1000)
# - If your miners consistently hit this floor, decrease share_target_ratio
#
# DO NOT set this below 1.0 unless you have a specific reason.
# Extremely low min_difficulty defeats the purpose of dynamic adjustment.
min_difficulty = 2.0

# Maximum pool difficulty (absolute ceiling).
#
# Rationale:
# - Prevents pool difficulty from exceeding reasonable bounds
# - 1_000_000.0 is high enough for any realistic scenario
# - Protects against bugs or extreme network difficulty spikes
# - If miners consistently hit this ceiling, increase share_target_ratio
max_difficulty = 1000000.0

# Maximum allowed pool difficulty change per update.
#
# Rationale:
# - Prevents sudden difficulty jumps from destabilizing miners
# - 0.5 = 50% max change per update (industry standard)
# - Lower values (0.25-0.33) = more stable, slower adaptation
# - Higher values (0.67-1.0) = faster adaptation, more volatile
max_change_pct = 0.5

# Target time between accepted shares for vardiff tuning.
#
# Rationale:
# - This is the TARGET, not a hard limit
# - VarDiff adjusts each miner's difficulty to achieve this average
# - Lower values = more shares, more precise hashrate estimation
# - Higher values = fewer shares, less server load
# - 15.0 seconds is a good balance for most deployments
#
# Trade-offs:
# - 5s: Very responsive, high server load, may cause network congestion
# - 15s: Balanced [RECOMMENDED]
# - 30s: Lower load, slower hashrate detection
# - 60s+: Only for very high-hashrate pools with many miners
#
# Monitor your server's share acceptance rate and adjust accordingly.
# Ideal: 2-10 shares per minute per miner
vardiff_target_secs = 15.0

# How often vardiff is allowed to retarget per miner.
#
# Rationale:
# - Must be significantly longer than vardiff_target_secs
# - Allows enough share samples for meaningful statistics
# - Shorter intervals = faster adaptation, more volatility
# - Longer intervals = more stability, slower adaptation
# - 90.0 seconds provides good stability with reasonable adaptation
#
# Rule of thumb: vardiff_retarget_secs >= 6 * vardiff_target_secs
# With target=15s and retarget=90s, you get ~6 samples per adjustment
vardiff_retarget_secs = 90.0

# -----------------------------------------------------------------------------
# Example Scenarios
# -----------------------------------------------------------------------------
#
# Testnet with low hashrate:
#   share_target_ratio = 50.0    # Easier shares
#   min_difficulty = 1.0         # Lower floor for weak miners
#   vardiff_target_secs = 10.0   # More frequent shares for better tracking
#
# Mainnet production pool:
#   share_target_ratio = 100.0   # Balanced
#   min_difficulty = 10.0        # Higher floor (network diff is higher)
#   vardiff_target_secs = 15.0   # Standard target
#
# High-hashrate pool (many ASIC miners):
#   share_target_ratio = 200.0   # Harder shares (miners are powerful)
#   min_difficulty = 50.0        # Higher floor
#   vardiff_target_secs = 20.0   # Fewer shares needed for stats
# -----------------------------------------------------------------------------

# Protocol hardening limits.
max_request_line_bytes = 8192
per_conn_req_per_sec = 128
conn_idle_timeout_secs = 180

# Bound how many jobs are kept in memory for stale-job / duplicate-request handling.
max_jobs_cache = 512

[pool.mining_identity]
# The payout destination for block subsidies and mining rewards.
# One of these must be set:
# - payout_address (recommended for operator ergonomics)
# - payout_script_hex (raw scriptPubKey)
#
# The resolved script must not be OP_RETURN / nulldata.
payout_address = "lotus_qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq"
# payout_script_hex = "76a914...88ac"

# Optional UTF-8 pool/operator identity tag embedded in coinbase scriptSig.
# This is metadata, not a payout destination.
# coinbase_identity = "Lotusia Pool"

[pool.fee]
# Enable or disable pool fee collection.
# When enabled, the fee is deducted from gross block reward before miner payouts.
enabled = true

# Fee rate in basis points.
# Example: 100 = 1.00%, 50 = 0.50%, 0 = disabled behavior without turning off the section.
fee_bps = 100

# Fee destination.
# One of these must be set when fee collection is enabled:
# - fee_address
# - fee_script_hex
fee_address = "lotus_qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq"
# fee_script_hex = "76a914...88ac"

[pool.pplns]
# Difficulty-weighted PPLNS window multiplier.
# 1.0 means roughly one block's worth of work in the window.
# Larger values smooth variance but slow down responsiveness.
n_multiplier = 1.0

# Minimum miner payout threshold, in satoshis.
# Outputs below this are filtered out rather than producing dust.
min_payout_sat = 546

# Scheduler interval, in seconds.
# The scheduler checks for matured found blocks and produces payout batches on this cadence.
payout_interval_secs = 3600

# Minimum confirmations required before a found block becomes payout-eligible.
# The code also enforces a hard coinbase maturity baseline of 100 blocks.
min_confirmations = 100

[pool.signing]
# Signing mode for payout batches.
# Currently supported first-draft mode:
# - internal: sign inside the pool process using `private_key`
#
# Other modes are reserved for future transport integrations.
mode = "internal"

# Private key material for internal signing.
# Accepted formats for scheduler signing path:
# - 32-byte hex
# - WIF / base58check-encoded secret key
#
# Never log this value. Prefer loading from a secure file or secret store.
private_key = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"


# lotusd JSON-RPC endpoint used for raw transaction broadcast.
# This matches Chronik's broadcast mechanics: raw tx -> JSON-RPC sendrawtransaction.
[bitcoind_rpc]
url = "http://127.0.0.1:10604"
rpc_user = "lotus"
rpc_pass = "supersecurepassword"
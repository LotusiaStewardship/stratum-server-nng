# Stratum Server NNG — Configuration Reference
#
# Copy this file to config.toml and adjust values for your deployment.
# All fields have sensible defaults where noted; only a few are required.
#
# Environment variable overrides:
#   NNG_RPC_URL        → nng_rpc_url
#   NNG_PUB_URL        → nng_pub_url
#   STRATUM_API_TOKEN  → api_token
#   DATABASE_PATH      → sqlite_path
#   DATABASE_NETWORK   → network (auto-detected from bitcoind_rpc.url port)
#   BITCOIND_RPC_URL   → bitcoind_rpc.url
#   BITCOIND_RPC_USER  → bitcoind_rpc.rpc_user
#   BITCOIND_RPC_PASS  → bitcoind_rpc.rpc_pass
#   POOL_PAYOUT_ADDRESS      → pool.mining_identity.payout_address
#   POOL_COINBASE_IDENTITY   → pool.mining_identity.coinbase_identity
#   POOL_FEE_ENABLED         → pool.fee.enabled
#   POOL_FEE_BPS             → pool.fee.fee_bps
#   POOL_FEE_ADDRESS         → pool.fee.fee_address
#   POOL_PPLNS_N_MULTIPLIER  → pool.pplns.n_multiplier
#   POOL_PPLNS_MIN_PAYOUT_SAT → pool.pplns.min_payout_sat
#   POOL_SIGNING_MODE         → pool.signing.mode
#   POOL_SIGNING_PRIVATE_KEY  → pool.signing.private_key
#   DEBUG                     → debug ("true"/"1"/"yes")

# === Server ===

# TCP bind address for Stratum V1 miner connections.
stratum_bind = "0.0.0.0:3334"

# HTTP bind address for API (health, stats, workers, etc.).
api_bind = "127.0.0.1:18080"

# Bearer token for API authentication. Required. All endpoints except /health
# require `Authorization: Bearer <token>`. Default: "devtoken".
# api_token = "devtoken"

# === lotusd Connection ===

# NNG RPC URL for template fetching and coinbase identity registration.
# Format: ipc:///path/to/lotusd.rpc (Unix socket) or tcp://host:port
nng_rpc_url = "ipc:///tmp/lotusd.rpc"

# NNG Pub/Sub URL for real-time events (template changes, block connects/disconnects).
# Default: same as nng_rpc_url with ".pub" suffix.
# nng_pub_url = "ipc:///tmp/lotusd.pub"

# === Database ===

# SQLite path. If empty or contains "stratum-accounting", auto-derived from network.
# Convention: ./dbs/{network}/stratum-accounting.sqlite3
# Explicit path is NOT suffixed — set it directly for custom locations.
# sqlite_path = ""

# Network: "mainnet", "testnet", or "regtest". Auto-detected from RPC port
# (10604=mainnet, 11604=testnet, 12604=regtest) if not set. Required.
# network = "mainnet"

# === lotusd JSON-RPC ===

[bitcoind_rpc]
# HTTP JSON-RPC URL for submitblock, getblockcount, getblockhash, getrawtransaction.
# Default: "http://127.0.0.1:10604"
# url = "http://127.0.0.1:10604"
# RPC username (lotusd -rpcuser).
rpc_user = "lotus"
# RPC password (lotusd -rpcpassword).
rpc_pass = "lotus"

# === Variable Difficulty ===

[vardiff]
# Absolute minimum pool difficulty floor. Default: 0.001
# min_floor = 0.001

# Initial pool difficulty as fraction of network difficulty. Default: 0.01 (1%)
# initial_pct = 0.01

# Target seconds between accepted shares. Default: 20.0
# target_secs = 20.0

# How often to retarget (seconds). Default: 60.0
# retarget_secs = 60.0

# Deadband: skip retarget when share rate is within ±N% of target.
# Prevents oscillation from Poisson variance. Default: 0.30 (±30%)
# variance_percent = 0.30

# === Pool ===

[pool]
# Optional display name.
# name = "My Lotus Pool"

# === Pool → Mining Identity ===
# REQUIRED for production. Without this, block rewards are burned (OP_RETURN).
# Set exactly one of payout_address or payout_script_hex.

[pool.mining_identity]
# Lotus address where block rewards are sent.
# payout_address = "lotus_16PSJNRge55cpi1srcnK6A3YXuTZKpzrUir3ZBwTD"

# Raw hex-encoded output script (alternative to payout_address).
# payout_script_hex = "76a914ad8b796954a46f0f32a867d3fd8855043cc506ba88ac"

# Optional UTF-8 tag embedded in coinbase input scriptSig (visible in block explorers).
# coinbase_identity = "Mined by MyPool"

# === Pool → Fee ===

[pool.fee]
# Enable pool fee collection. Default: true
# enabled = true

# Fee rate in basis points (100 = 1.00%). Default: 100 (1%)
# fee_bps = 100

# Lotus address for fee collection.
# fee_address = "lotus_..."

# Raw hex-encoded output script (alternative to fee_address).
# fee_script_hex = "76a914..."

# === Pool → PPLNS ===

[pool.pplns]
# PPLNS window multiplier × network difficulty. Default: 5.0
# n_multiplier = 5.0

# Minimum miner payout in satoshis (smaller amounts carried as dust). Default: 546
# min_payout_sat = 546

# Auto-create and sign payout batches when blocks mature. Default: true.
# Set to false for manual processing via POST /api/v1/admin/payouts/trigger/{hash}.
# payout_enabled = true

# Confirmations required before block is payout-eligible. Default: 100 (mainnet).
# Use 1 for regtest.
# min_confirmations = 100

# === Pool → PPLNS → Banning ===

[pool.pplns.banning]
# Enable per-session banning for excessive invalid shares. Default: false.
# enabled = false

# Shares to collect before checking rejection ratio. Default: 50.
# check_threshold = 50

# Maximum allowed rejection percentage (sessions above this are disconnected). Default: 50.0.
# invalid_percent = 50.0

# === Pool → Signing ===

[pool.signing]
# "internal" (in-process secp256k1) or "external" (HTTP webhook). Default: "internal".
# mode = "internal"

# Required for mode="internal": 32-byte hex or WIF private key.
# private_key = "cVjF..."

# Required for mode="external": webhook URL that accepts POST with payout plan JSON.
# webhook_url = "https://signer.example.com/api/v1/payout"

# Transaction fee rate in sat/kB for payout transactions. Default: 1000 (1 sat/vByte).
# tx_fee_per_kb = 1000

# === Debug ===

# Enable verbose logging (template data, share submissions, validation, block submission).
# Default: false.
# debug = false

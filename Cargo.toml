[package]
name = "stratum-server-nng"
version = "0.1.0"
authors = ["Lotusia Stewardship <stewardship@lotusia.org>"]
edition = "2021"
description = "Production-grade Stratum V1 pool server for Lotus using NNG endpoints"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
askama = "0.12"
askama_axum = "0.4"
axum = { version = "0.7", features = ["macros"] }
bitcoinsuite-bitcoind = { path = "../bitcoinsuite/bitcoinsuite-bitcoind" }
bitcoinsuite-bitcoind-nng = { path = "../bitcoinsuite/bitcoinsuite-bitcoind-nng" }
bitcoinsuite-bitcoind-stratum = { path = "../bitcoinsuite/bitcoinsuite-bitcoind-stratum" }
bitcoinsuite-core = { path = "../bitcoinsuite/bitcoinsuite-core" }
bitcoinsuite-ecc-secp256k1 = { path = "../bitcoinsuite/bitcoinsuite-ecc-secp256k1" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
primitive-types = "0.12"
thiserror = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["compression-gzip", "trace", "fs"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
flatbuffers = "25"
governor = { version = "0.6", features = ["std"] }
url = "2"

[dev-dependencies]
tempfile = "3"
